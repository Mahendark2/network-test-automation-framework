version: "3.8"

# LAB TOPOLOGY
#
#   device-1  ---(net-a, 172.28.1.0/24)---  device-2  ---(net-b, 172.28.2.0/24)---  device-3
#
# device-1 and device-3 are on DIFFERENT subnets and are NOT directly connected.
# device-2 sits on both subnets and acts as the router/hop between them, with
# IP forwarding enabled. This forces traffic from device-1 to device-3 to take
# a real routed, multi-hop path -- not flat single-network connectivity.

services:
  device-1:
    image: alpine:3.19
    container_name: device-1
    hostname: device-1
    cap_add:
      - NET_ADMIN
    networks:
      net-a:
        ipv4_address: 172.28.1.11
    command: >
      sh -c "apk add --no-cache iproute2 iputils bash >/dev/null &&
             ip route add 172.28.2.0/24 via 172.28.1.12 &&
             tail -f /dev/null"

  device-2:
    image: alpine:3.19
    container_name: device-2
    hostname: device-2
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net-a:
        ipv4_address: 172.28.1.12
      net-b:
        ipv4_address: 172.28.2.12
    command: >
       sh -c "apk add --no-cache iproute2 iputils bash >/dev/null &&
         tail -f /dev/null"

  device-3:
    image: alpine:3.19
    container_name: device-3
    hostname: device-3
    cap_add:
      - NET_ADMIN
    networks:
      net-b:
        ipv4_address: 172.28.2.13
    command: >
      sh -c "apk add --no-cache iproute2 iputils bash >/dev/null &&
             ip route add 172.28.1.0/24 via 172.28.2.12 &&
             tail -f /dev/null"

networks:
  net-a:
    ipam:
      config:
        - subnet: 172.28.1.0/24
  net-b:
    ipam:
      config:
        - subnet: 172.28.2.0/24
